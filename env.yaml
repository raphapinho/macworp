name: macworp_viralflow
channels:
  - wallaulab
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # -------------------
  # Core
  # -------------------
  - python=3.9
  - pip
  - setuptools
  - wheel

  # -------------------
  # Workflow / Bioinfo
  # -------------------
  - nextflow=22.04.0
  - singularityce=3.11.4
  - spython
  - snpeff=5.0
  - biopython=1.81
  - numpy=1.26.4
  - pandas=2.1.1

  # -------------------
  # Backend / Orquestração
  # -------------------
  - nodejs=18.*
  - yarn
  - libpq
  - cython
  - yaml

  # -------------------
  # Sistema (mínimo necessário)
  # -------------------
  - openjdk=17
  - curl
  - jq
  - ca-certificates
  - openssl
  - zlib
  - xz

  # -------------------
  # Pip (MacWorp)
  # -------------------
  - pip:
      - -e ./backend[dev]
      - -e ./worker[dev,demo]
      - -r ./requirements.txt
